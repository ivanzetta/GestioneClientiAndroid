
name: Build YellowKunde APK and AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK and AAB
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug bundleRelease
          else
            gradle assembleDebug bundleRelease
          fi

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YellowKunde-APK-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: YellowKunde-AAB-Release-Unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
