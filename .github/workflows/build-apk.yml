
name: Build YellowKunde APK and AAB

on:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

     
      - name: Build APK and AAB
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          JAVA_TOOL_OPTIONS: "-Xmx4g"
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --max-workers=2 bundleRelease
          else
            gradle --no-daemon --max-workers=2 bundleRelease
          fi


      

      - name: Sign Release AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.YELLOWKUNDE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YELLOWKUNDE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YELLOWKUNDE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YELLOWKUNDE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yellowkunde-upload.jks"

          AAB="app/build/outputs/bundle/release/app-release.aab"
          VERSION_NAME=$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME" || { echo "versionName non trovato"; exit 1; }
          SIGNED_AAB="app/build/outputs/bundle/release/YellowKunde-${VERSION_NAME}-signed.aab"

          jarsigner \
            -keystore "$RUNNER_TEMP/yellowkunde-upload.jks" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -signedjar "$SIGNED_AAB" \
            "$AAB" "$KEY_ALIAS"

          jarsigner -verify "$SIGNED_AAB"
          echo "AAB firmato e verificato: $SIGNED_AAB"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: YellowKunde-AAB-Release-Firmato
          path: app/build/outputs/bundle/release/YellowKunde-*-signed.aab
          if-no-files-found: error
